name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: v3/sva-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests/cli tests/integration
      - name: Ruff format
        run: ruff format --check src/sva_toolkit/cli tests/cli tests/integration
      - name: Unit and module tests
        run: pytest tests --ignore=tests/integration -q
      - name: Build
        run: python -m build --no-isolation

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: v3/sva-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: pytest tests/integration -q

  mypy:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: v3/sva-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy src
