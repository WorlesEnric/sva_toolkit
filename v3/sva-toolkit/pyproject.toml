[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sva-toolkit"
version = "3.0.0a1"
description = "SVA toolkit for formal verification, timing diagrams, and assertion workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SVA Toolkit Authors" }]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest>=7.0.0",
    "pytest-asyncio",
    "ruff",
]
llm = ["openai"]
timing-render = ["cairosvg", "wavedrom>=2.0.3.post3"]
formal = []
rich = ["rich"]
all = [
    "build",
    "cairosvg",
    "mypy",
    "openai",
    "pytest>=7.0.0",
    "pytest-asyncio",
    "rich",
    "ruff",
    "wavedrom>=2.0.3.post3",
]

[project.scripts]
sva = "sva_toolkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
